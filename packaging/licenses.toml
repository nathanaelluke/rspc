# The checked-in bundle covers all supported release targets, including build tools.
accepted = [
    "MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "BSL-1.0",
    "Apache-2.0 WITH LLVM-exception", "MPL-2.0", "OpenSSL",
    "CDLA-Permissive-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
ignore-dev-dependencies = true
ignore-build-dependencies = false
workarounds = ["ring", "chrono", "rustls", "rustix", "cocoa"]

# This frontend dependency needs its corresponding source supplied with releases.
[ansi_colours]
accepted = ["LGPL-3.0-or-later"]

