[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Development and release tools for rspc"
default-run = "xtask"

[dependencies]
anyhow = "1"
clap = { workspace = true }
serde_json = "1"
regex = "1"
sha2 = "0.10"
tempfile = "3"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect"] }
futures = "0.3"
rspc = { path = "../.." }

[dev-dependencies]
libc = "0.2"
