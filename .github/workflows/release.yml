name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 1
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev mpd
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf openssl@3 mpd
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Set up Rust
        run: |
          rustup update stable --profile minimal
          rustup default stable
      - name: Check tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          cargo build --release --locked -j2 -p rspc -p rspc-ui
          cargo test --locked -j2 --workspace
          version=$(target/debug/xtask version)
          if [ "$RELEASE_REF_TYPE" = tag ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo 'Tag and Cargo version differ' >&2
            exit 1
          fi
      - name: Package
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          target/debug/xtask archive --target "$RELEASE_TARGET" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rspc-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rspc-*
          path: dist
          merge-multiple: true
      - name: Prepare Rust release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          rustup update stable --profile minimal
          rustup default stable
          cargo build --locked -j2 -p xtask
      - name: Check publication contents and prepare package recipes
        run: |
          target/debug/xtask check-release --history
          version=$(target/debug/xtask version)
          git archive --format=tar.gz --prefix="rspc-$version/" --output="dist/rspc-$version-source.tar.gz" HEAD
          target/debug/xtask recipes --artifacts dist --output package-recipes
          tar -czf dist/package-recipes.tar.gz -C package-recipes .
          target/debug/xtask checksums --artifacts dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
      - name: Create draft release for review
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "rspc $RELEASE_TAG" --generate-notes
