name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      RUST_TEST_THREADS: 1
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        if: runner.os == 'Linux'
      - name: Install Linux test MPD
        if: runner.os == 'Linux'
        run: |
          player=$(nix build '.#mpd^out' --no-link --print-out-paths --max-jobs 1 --cores 1)
          echo "$player/bin" >> "$GITHUB_PATH"
          "$player/bin/mpd" --version
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkgconf openssl@3 mpd
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Check tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          cargo build --release --locked -j2 -p rspc -p rspc-ui
          cargo test --locked -j2 --workspace
          version=$(target/debug/xtask version)
          if [ "$RELEASE_REF_TYPE" = tag ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo 'Tag and Cargo version differ' >&2
            exit 1
          fi
      - name: Package
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          target/debug/xtask archive --target "$RELEASE_TARGET" --output dist
      - name: Verify packaged executables and licenses
        run: |
          version=$(target/debug/xtask version)
          unpacked=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$unpacked"
          package="$unpacked/rspc-$version"
          "$package/bin/rspc" --version
          "$package/bin/rspc-ui" version
          test -s "$package/share/licenses/rspc/LICENSE-THIRD-PARTY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rspc-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rspc-*
          path: dist
          merge-multiple: true
      - name: Prepare Rust release tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --locked -j2 -p xtask
      - name: Check publication contents and prepare package recipes
        run: |
          target/debug/xtask check-release --history
          target/debug/xtask source-archive --output dist
          target/debug/xtask recipes --artifacts dist --output package-recipes
          tar -czf dist/package-recipes.tar.gz -C package-recipes .
          target/debug/xtask checksums --artifacts dist
      - name: Verify offline source archive
        run: |
          version=$(target/debug/xtask version)
          unpacked=$(mktemp -d)
          tar -xzf "dist/rspc-$version-source.tar.gz" -C "$unpacked"
          cd "$unpacked/rspc-$version"
          source_cargo_home=$(mktemp -d)
          export CARGO_HOME="$source_cargo_home"
          cargo metadata --locked --offline --format-version 1 > "$RUNNER_TEMP/source-metadata.json"
          cargo build --locked --offline --release -j2 -p rspc -p rspc-ui
          ./target/release/rspc --version
          ./target/release/rspc-ui version
          test -s packaging/LICENSE-THIRD-PARTY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/*
      - name: Create draft release for review
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "rspc $RELEASE_TAG" --generate-notes

  homebrew:
    needs: assemble
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Test generated cask on Apple Silicon
        run: |
          tar -xzf dist/package-recipes.tar.gz
          tap="$RUNNER_TEMP/rspc-tap"
          mkdir -p "$tap/Casks"
          cp homebrew/Casks/rspc.rb "$tap/Casks/rspc.rb"
          git -C "$tap" init -b main
          git -C "$tap" add Casks/rspc.rb
          git -C "$tap" -c user.name=Test -c user.email=test@example.org commit -m 'Test release cask'
          brew tap nathanaelluke/rspc-release-test "$tap"
          tap="$(brew --repository nathanaelluke/rspc-release-test)"
          brew style --cask nathanaelluke/rspc-release-test/rspc
          # Exercise the exact release archive before its download URL is public.
          python3 - "$tap/Casks/rspc.rb" "$PWD/dist" <<'PY'
          import pathlib, re, sys
          cask = pathlib.Path(sys.argv[1])
          text = cask.read_text()
          version = re.search(r'^  version "([^"]+)"', text, re.M).group(1)
          text = re.sub(
              r'url "https://github.com/nathanaelluke/rspc/releases/download/[^/]+/(rspc-[^"]+)"',
              lambda match: 'url "' + (pathlib.Path(sys.argv[2]) / match.group(1).replace('#{version}', version)).as_uri() + '"',
              text,
          )
          cask.write_text(text)
          PY
          brew install --cask nathanaelluke/rspc-release-test/rspc
          rspc --version
          rspc-ui version
          soloist --version
          brew uninstall --cask nathanaelluke/rspc-release-test/rspc
