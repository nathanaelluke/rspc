// Fields observed in Soloist's version-1 local session envelope.
// This is an internal storage format, not Soloist's public API.
syntax = "proto3";
package rspc.soloist;

message Storage { repeated Item items = 1; }
message Item {
    string username = 3;
    EncryptedPayload encrypted_payload = 4;
}
message EncryptedPayload {
    uint32 version = 1;
    bytes ciphertext = 2;
}
message SessionPayload {
    RefreshToken refresh_token = 1;
    DpopInfo dpop_info = 2;
}
message RefreshToken { string refresh_token = 1; }
message DpopInfo {
    KeyReference key_reference = 1;
    string nonce = 2;
}
message KeyReference { bytes key_reference = 1; }

message ClientTokenRequest {
    uint32 request_type = 1;
    ClientData client_data = 2;
}
message ClientData {
    string client_version = 1;
    string client_id = 2;
    ConnectivityData connectivity_sdk_data = 3;
}
message ConnectivityData {
    PlatformData platform_specific_data = 1;
    string device_id = 2;
    ApplicationData application_specific_data = 3;
    string developer_api_key = 4;
}
message PlatformData { LinuxData desktop_linux = 5; }
message LinuxData {
    string system_name = 1;
    string system_release = 2;
    string system_version = 3;
    string hardware = 4;
}
message ApplicationData { SpeakerData core_speaker = 1; }
message SpeakerData {
    string brand_name = 1;
    string model_name = 2;
    string sdk_version = 6;
}
message ClientTokenResponse {
    uint32 response_type = 1;
    ClientGrant granted_token = 2;
}
message ClientGrant {
    string token = 1;
    uint32 expires_after_seconds = 2;
    uint32 refresh_after_seconds = 3;
}

// Connect binds a one-use authorization code to the receiver's key and PKCE.
message AuthInfo {
    string id = 1;
    string client_id = 2;
    AuthInfoMethod method = 3;
}
message AuthInfoMethod { DpopBoundAuthCodeInfo dpop_bound_auth_code = 1; }
message DpopBoundAuthCodeInfo {
    string jkt = 1;
    string pkce_code_challenge = 2;
}
message AuthToken {
    string auth_info_id = 1;
    oneof token { DpopBoundAuthCode dpop_bound_auth_code = 10; }
}
message DpopBoundAuthCode { string value = 1; }
